name: GitHub Trending Scraper

on:
  schedule:
    - cron: "0 23 * * *"  # UTC 23:00
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  scrape-github-trending:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: America/New_York

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm@10.34.5

      - name: Install Dependencies
        run: pnpm install

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}" ]; then
            echo "::error::Missing required GitHub Actions secret: CLOUDFLARE_AI_GATEWAY_TOKEN"
            exit 1
          fi

      - name: Run GitHub Trending Scraper
        run: pnpm exec vite-node ./github-trending.ts
        env:
          AI_API_KEY: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEEN }}
          AI_API_URL: https://gateway.ai.cloudflare.com/v1/5697c41d4efbabcbac78eafe2cdf036b/default/compat/chat/completions
          AI_MODEL: workers-ai/@cf/zai-org/glm-4.7-flash

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/github/ README.md
          git commit -m "更新 GitHub Trending - $(date +'%Y-%m-%d')" || echo "No changes"
          git push
